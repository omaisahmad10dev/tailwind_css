<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
     <link rel="icon" type="image/x-icon" href="images/favicon.png">
    <title>facebook</title>
</head>
<body class="bg-gray-100">
    <div class="container mt-48 flex mx-auto justify-center ">
        <div class="left w-1/3 ">
            <img class="w-60 mix-blend-multiply" src="images/images.png" alt="">
            <p class="text-xl">A Meta Account lets you access multiple <br> Meta technologies, such as Facebook.</p>
        </div>
        <div class="right flex flex-col p-2 bg-white rounded-2xl w-81 relative">
            <input class="px-4 h-12 my-2 border-1 border-gray-200 outline-blue-500 rounded-lg" type="text" placeholder="Email address or Phone number">
            <input class="px-4 h-12 my-2 border-1 border-gray-200 outline-blue-500 rounded-lg" type="text" placeholder="Password">
            <button class="bg-blue-600 py-3 rounded-xl text-xl hover:cursor-pointer hover:bg-blue-700">Login In</button>
            <span class="text-blue-600 text-center py-4 hover:cursor-pointer hover:underline">Forgetten Password</span>
            <hr>
            <button class="bg-green-600 py-3 px-4 mx-auto rounded-xl text-xl hover:cursor-pointer my-2 w-fit items-center hover:bg-green-700 ">Create New Account</button>
            <span class="absolute -bottom-13 text-sm "><span class="font-bold hover:underline cursor-pointer">create a page</span> for a celebrity, brand or business.</span>
        </div>
    </div>
</body>
</html>
